name: Build + publish distributables (one zip for all desktops + Android)

# Builds every distributable and, when run on a version tag (or a
# workflow_dispatch with release_tag), creates the GitHub release page itself
# and attaches the zips to it. One push of a v* tag ships the lot:
#   - AutoEditorModv1.5-Linux-macOS-Windows.zip — ALL desktops in ONE zip:
#                                          Windows / macOS Intel / macOS Apple
#                                          Silicon / Linux, via the four
#                                          "1 Run-*" launchers. Pre-built UI.
#   - AutoEditorModv1.5-Android.zip       — Termux on-device build
# Run manually from the repo's Actions tab (leave release_tag empty to only
# build + upload artifacts) or just push a version tag, e.g. git tag v1.5.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.5). Empty = build artifacts only."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-desktops
            runner: ubuntu-latest
            arch: all-desktops
            needs_npm: "false" # build-dist-unified.mjs installs + builds the UI itself
            build: node build-dist-unified.mjs
            asset: AutoEditorModv1.5-Linux-macOS-Windows.zip
          - name: android
            runner: ubuntu-latest
            arch: android
            needs_npm: "true"
            build: node build-dist-termux.mjs
            asset: AutoEditorModv1.5-Android.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        if: matrix.needs_npm == 'true'
        run: npm install

      - name: Install server deps (pulls the platform ffmpeg binary / bundles server)
        if: matrix.needs_npm == 'true'
        run: npm install
        working-directory: server

      - name: Build distributable
        run: ${{ matrix.build }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute version from tag / input
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="${{ github.event.inputs.release_tag }}"; fi
          if [ -z "$TAG" ]; then echo "No target release tag; skipping publish."; exit 0; fi
          echo "tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Write release notes from changelog
        id: notes
        run: |
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync("dist-assets/changelog.txt", "utf8");
            const v = process.argv[1];
            const i = t.search(new RegExp("^Version " + v.replace(/\./g, "\\.") + "\\b", "m"));
            if (i < 0) { console.error("no changelog section for v" + v); process.exit(0); }
            const rest = t.slice(i).split(/\n(?=Version \d+)/)[0].trim();
            process.stdout.write("**AutoEditor Mod v" + v + "**\n\n" + rest + "\n\nRun it entirely on your own machine — nothing is uploaded.");
          ' "${{ steps.ver.outputs.ver }}" > "notes-${{ steps.ver.outputs.ver }}.md"
          echo "note_file=notes-${{ steps.ver.outputs.ver }}.md" >> "$GITHUB_OUTPUT"

      - name: Create release page (if it doesn't exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.ver }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its assets only."
          else
            gh release create "$TAG" \
              --title "AutoEditor Mod v$VER" \
              --notes-file "${{ steps.notes.outputs.note_file }}" \
              --target "$GITHUB_SHA"
          fi

      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" release-assets/* --clobber